<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oblique Shock Relations</title>
</head>
<body>
    <h1>Oblique Shock Relations Calculator</h1>
    <form method="POST">
        <label for="mach">Mach Number (M):</label>
        <input type="number" step="0.01" id="mach" name="mach" required>
        <br>
        <label for="beta">Shock Angle (β in degrees):</label>
        <input type="number" step="0.01" id="beta" name="beta" required>
        <br>
        <label for="gamma">Gamma (γ):</label>
        <input type="number" step="0.01" id="gamma" name="gamma" required>
        <br>
        <button type="submit">Calculate</button>
    </form>

    {% if results %}
    <h2>Results:</h2>
    <ul>
        {% for key, value in results.items() %}
        <li>{{ key }}: {{ value }}</li>
        {% endfor %}
    </ul>
    {% endif %}
</body>
</html>
